map $http_x_forwarded_proto $client_proto {
    default $scheme;
    https https;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 50m;
    # llms.txt and robots.txt contain Chinese; declare the encoding for text responses.
    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    # The site sits behind another reverse proxy (OpenResty).  Proxied requests
    # carry a Via header and often arrive as HTTP/1.0, both of which disable
    # gzip by default -- which is why the 299 KB app bundle shipped uncompressed.
    gzip_proxied any;
    gzip_http_version 1.0;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;

    # Security headers (also reported by Lighthouse "best practices").
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    location /api/ {
        proxy_pass http://mmcat-api:8000;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $client_proto;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
    }

    # add_header inside a location replaces the server-level headers, so the
    # security headers are repeated wherever a location sets its own.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /icons/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Real files only: otherwise the SPA fallback answers /robots.txt with HTML.
    location = /robots.txt {
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
