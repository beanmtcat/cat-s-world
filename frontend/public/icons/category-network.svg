<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="net-fill" x1="10" y1="6" x2="38" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="net-stroke" x1="8" y1="6" x2="40" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="55%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="net-node" x1="18" y1="34" x2="30" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>
  <!-- Globe sphere -->
  <circle cx="24" cy="19.5" r="13.5" fill="url(#net-fill)" stroke="url(#net-stroke)" stroke-width="2.4"/>
  <!-- Meridian & latitude lines -->
  <ellipse cx="24" cy="19.5" rx="6.2" ry="13.5" stroke="url(#net-stroke)" stroke-width="2" stroke-opacity="0.8"/>
  <path d="M11.2 15.5H36.8M11.2 23.5H36.8" stroke="url(#net-stroke)" stroke-width="2" stroke-linecap="round" stroke-opacity="0.75"/>
  <!-- Bus & routing stem -->
  <path d="M24 33V38.5M9 39.5H39" stroke="url(#net-stroke)" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Network endpoint nodes -->
  <circle cx="11" cy="39.5" r="3" fill="#e0f2fe" stroke="url(#net-stroke)" stroke-width="2.2"/>
  <circle cx="24" cy="39.5" r="3.6" fill="url(#net-node)" stroke="#ffffff" stroke-width="1.2"/>
  <circle cx="37" cy="39.5" r="3" fill="#e0f2fe" stroke="url(#net-stroke)" stroke-width="2.2"/>
</svg>
